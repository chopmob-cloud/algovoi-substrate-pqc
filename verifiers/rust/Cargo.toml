[package]
name = "algovoi-pqc-rust"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "algovoi-pqc-rust"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_jcs = "0.2"
# ES256 — P-256 ECDSA (getrandom feature enables built-in OsRng key gen)
p256 = { version = "0.14.0-rc.9", features = ["ecdsa", "pkcs8", "getrandom"] }
ecdsa = { version = "0.17.0-rc.1", features = ["der"] }
# Ed25519
ed25519-dalek = { version = "3.0.0-rc.0", features = ["rand_core"] }
# ML-DSA-65 (RustCrypto FIPS 204)
ml-dsa = { version = "0.1.0", features = ["getrandom"] }
# Falcon-1024 (PQClean wrapper, requires C compiler)
pqcrypto-falcon = "0.4.1"
pqcrypto-traits = "0.3"
# Utility
sha2 = "0.10"
base64 = "0.22"
# getrandom 0.3 for raw entropy (ed25519-dalek key via from_bytes)
getrandom = { version = "0.3" }
hex = "0.4"
pkcs8 = { version = "0.11.0-rc.2", features = ["alloc"] }
spki = { version = "0.8.0-rc.3", features = ["alloc"] }
